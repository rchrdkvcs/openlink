name: Feature request
description: Suggest an improvement to Openlink
title: "[Feature]: "
labels:
  - needs-triage
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or use case should Openlink address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: How do you solve this today, or what other approaches did you consider?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, screenshots, or related projects when useful.
