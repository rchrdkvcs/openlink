name: Deploy to Coolify

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  publish-image:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - name: Check that this is the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          latest_release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.id')"
          if [ "$RELEASE_ID" = "$latest_release_id" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out release
        if: steps.release.outputs.publish == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Docker Buildx
        if: steps.release.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        if: steps.release.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish versioned and latest images
        if: steps.release.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.event.release.tag_name }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            OPENLINK_VERSION=${{ github.event.release.tag_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}

  deploy:
    if: github.event.release.prerelease == false
    needs: publish-image
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
        run: |
          if [[ -z "$COOLIFY_WEBHOOK" ]]; then
            echo "::error title=Missing Coolify webhook::Configure the COOLIFY_WEBHOOK repository secret."
            exit 1
          fi

          if [[ -z "$COOLIFY_TOKEN" ]]; then
            echo "::error title=Missing Coolify token::Configure the COOLIFY_TOKEN repository secret."
            exit 1
          fi

          if [[ ! "$COOLIFY_WEBHOOK" =~ ^https?:// ]]; then
            echo "::error title=Invalid Coolify webhook::COOLIFY_WEBHOOK must be an HTTP or HTTPS URL."
            exit 1
          fi

          latest_release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.id')"

          if [ "$RELEASE_ID" != "$latest_release_id" ]; then
            echo "Skipping release $RELEASE_ID because the latest release is $latest_release_id."
            exit 0
          fi

          curl --fail-with-body --show-error --location --request POST "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
