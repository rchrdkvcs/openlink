name: Publish release image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-publication
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      latest: ${{ steps.release.outputs.latest }}
      beta: ${{ steps.release.outputs.beta }}
    steps:
      - name: Select release publication
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            if [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+-beta(\.[0-9A-Za-z-]+)*(\+[0-9A-Za-z.-]+)?$ ]]; then
              echo "beta=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          latest_release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.id')"
          if [ "$RELEASE_ID" = "$latest_release_id" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "latest=true" >> "$GITHUB_OUTPUT"
          fi

  build-image:
    needs: check-release
    if: needs.check-release.outputs.publish == 'true'
    name: Build ${{ matrix.platform }} image
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            cache-scope: image-linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache-scope: image-linux-arm64
    steps:
      - name: Check out release
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Sign in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          pull: true
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}
          build-args: |
            OPENLINK_VERSION=${{ github.event.release.tag_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}

      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v7.0.2
        with:
          name: digest-${{ matrix.cache-scope }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-image:
    needs: [check-release, build-image]
    runs-on: ubuntu-latest
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Sign in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          TAG: ${{ github.event.release.tag_name }}
          PUBLISH_LATEST: ${{ needs.check-release.outputs.latest }}
          PUBLISH_BETA: ${{ needs.check-release.outputs.beta }}
        run: |
          tags=(--tag "$IMAGE:$TAG")
          if [ "$PUBLISH_LATEST" = "true" ]; then
            tags+=(--tag "$IMAGE:latest")
          fi
          if [ "$PUBLISH_BETA" = "true" ]; then
            tags+=(--tag "$IMAGE:beta")
          fi

          docker buildx imagetools create "${tags[@]}" $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect published image
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: docker buildx imagetools inspect "$IMAGE:$TAG"
