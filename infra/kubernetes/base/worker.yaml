apiVersion: apps/v1
kind: Deployment
metadata:
  name: openlink-worker
  namespace: openlink
spec:
  replicas: 1

  selector:
    matchLabels:
      app: openlink
      component: worker

  template:
    metadata:
      labels:
        app: openlink
        component: worker

    spec:
      containers:
        - name: worker
          image: openlink:local
          imagePullPolicy: Never

          command:
            - php
            - artisan
            - queue:work

          args:
            - --sleep=3
            - --tries=3
            - --timeout=90
            - --verbose

          envFrom:
            - configMapRef:
                name: openlink-config

          env:
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: openlink-secrets
                  key: APP_KEY

            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: openlink-secrets
                  key: POSTGRES_DB

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: openlink-secrets
                  key: POSTGRES_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openlink-secrets
                  key: POSTGRES_PASSWORD

          resources:
            requests:
              cpu: 50m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi
