name: Deploy to Coolify

on:
  release:
    types: [published]

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
        run: |
          if [[ -z "$COOLIFY_WEBHOOK" ]]; then
            echo "::error title=Missing Coolify webhook::Configure the COOLIFY_WEBHOOK repository secret."
            exit 1
          fi

          if [[ -z "$COOLIFY_TOKEN" ]]; then
            echo "::error title=Missing Coolify token::Configure the COOLIFY_TOKEN repository secret."
            exit 1
          fi

          if [[ ! "$COOLIFY_WEBHOOK" =~ ^https?:// ]]; then
            echo "::error title=Invalid Coolify webhook::COOLIFY_WEBHOOK must be an HTTP or HTTPS URL."
            exit 1
          fi

          curl --fail-with-body --show-error --location --request GET "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
