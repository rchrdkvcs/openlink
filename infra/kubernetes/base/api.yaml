apiVersion: apps/v1
kind: Deployment
metadata:
  name: openlink-api
  namespace: openlink
spec:
  replicas: 1

  selector:
    matchLabels:
      app: openlink
      component: api

  template:
    metadata:
      labels:
        app: openlink
        component: api

    spec:
      containers:
        - name: api
          image: openlink:local
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 8080

          envFrom:
            - configMapRef:
                name: openlink-config

          env:
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: openlink-secrets
                  key: APP_KEY

            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: openlink-secrets
                  key: POSTGRES_DB

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: openlink-secrets
                  key: POSTGRES_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openlink-secrets
                  key: POSTGRES_PASSWORD

          startupProbe:
            httpGet:
              path: /up
              port: http
            failureThreshold: 30
            periodSeconds: 2

          readinessProbe:
            httpGet:
              path: /up
              port: http
            periodSeconds: 5
            timeoutSeconds: 3

          livenessProbe:
            httpGet:
              path: /up
              port: http
            periodSeconds: 10
            timeoutSeconds: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: "1"
              memory: 512Mi
